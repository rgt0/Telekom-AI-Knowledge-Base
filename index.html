<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telekom AI Knowledge Base</title>

  <!-- ✅ JAVÍTÁS: helyes rel + href + relatív útvonal -->
  <link rel="stylesheet" href="./telekom-ui.css" />

  <!-- ✅ külön JS a navigációhoz és tartalomhoz -->
  <script defer src="./app.js"></script>
</head>

<body>
  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar" aria-label="Oldalsáv">
      <div class="sidebar__header">
        <div class="brand">T‑AI‑KB</div>
      </div>

      <div class="sidebar__search">
        <label class="sr-only" for="searchBox">Keresés</label>
        <input id="searchBox" type="search" placeholder="Keresés…" autocomplete="off" />
      </div>

      <nav class="sidebar__nav" id="sideNav" aria-label="Oldalsáv menü">
        <a href="#home" data-page="home" class="is-active">Főoldal</a>
        <a href="#ai-alapok" data-page="ai-alapok">AI‑Alapok</a>
        <a href="#prompt-engineering" data-page="prompt-engineering">Prompt Engineering</a>
        <a href="#ai-sandbox" data-page="ai-sandbox">AI Sandbox</a>
        <a href="#aimc-explain-engine" data-page="aimc-explain-engine">AIM/C Explain Engine</a>
        <a href="#eszkozok" data-page="eszkozok">Eszközök</a>
        <a href="#tudastar" data-page="tudastar">Tudástár</a>
        <a href="#rag" data-page="rag">RAG</a>
        <a href="#itf-adatlap" data-page="itf-adatlap">ITF‑Adatlap</a>
        <a href="#iranyelvek" data-page="iranyelvek">Irányelvek</a>

        <div class="nav-sep"></div>

        <a href="https://github.com/rgt0/Telekom-AI-Knowledge-Base" target="_blank" rel="noopener">
          GitHub repo
        </a>
      </nav>

      <div class="sidebar__footer">
        <small>© 2026 Telekom AI Knowledge Base</small>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">

      <!-- TOPBAR -->
      <header class="topbar" aria-label="Felső navigáció">
        <button class="icon-btn" id="menuBtn"
                aria-label="Menü"
                aria-controls="sidebar"
                aria-expanded="false">
          ☰
        </button>

        <div class="topbar__title">
          Telekom AI Knowledge Base
        </div>

        <!-- ✅ JAVÍTÁS: topnav wrap + overflow kezelve CSS-ben -->
        <nav class="topnav" id="topNav" aria-label="Fő navigáció">
          <a href="#ai-alapok" data-page="ai-alapok">AI Alapok</a>
          <a href="#prompt-engineering" data-page="prompt-engineering">Prompt Engineering</a>
          <a href="#ai-sandbox" data-page="ai-sandbox">AI Sandbox</a>
          <a href="#aimc-explain-engine" data-page="aimc-explain-engine">AIM/C Explain Engine</a>
          <a href="#eszkozok" data-page="eszkozok">Eszközök</a>
          <a href="#tudastar" data-page="tudastar">Tudástár</a>
          <a href="#rag" data-page="rag">RAG</a>
          <a href="#itf-adatlap" data-page="itf-adatlap">ITF‑Adatlap</a>
          <a href="#iranyelvek" data-page="iranyelvek">Irányelvek</a>
        </nav>
      </header>

      <!-- CONTENT -->
      <main class="content" id="content" tabindex="-1" aria-live="polite">
        <!-- JS tölti be -->
      </main>
    </div>
  </div>

  <!-- mobil overlay (sidebar nyitásnál) -->
  <div class="overlay" id="overlay" hidden></div>
</body>
</html>
