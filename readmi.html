<body>

  <!-- Dokumentáció fejléc -->
  <header class="doc-topbar">
    <div class="doc-title">📘 Telekom AI Knowledge Base – Dokumentáció</div>
    <nav class="doc-nav">
      <a href="./index.html#home">🏠 Főoldal</a>

  <!-- Tartalom -->
  <main class="content">
    <h1>T‑AI‑KB – Dokumentáció</h1>

    <p>
      Ez az oldal a <strong>Telekom AI Knowledge Base</strong>
      részletes dokumentációját tartalmazza.
      A portál főoldalán inkább navigálsz, itt olvasol.
    </p>

    <!-- IDE JÖN A TELJES DOKUMENTÁCIÓ -->
  </main>

  <!-- Script -->
  <script>
    let kbData = [];
    async function loadData() {
      const sources = [
        'MASTER_RAG_FULL.json',
        'MASTER_entities.json',
        'MASTER_relations.json'
      ];
      for (let src of sources) {
        const res = await fetch(src);
        if (res.ok) kbData = kbData.concat(await res.json());
      }
    }
    loadData();
  </script>

</body>
